<style>
/* HentaiVerse parchment + maroon, so players feel at home. Layout: one column, header nav, tables for scanning. */
:root{
  --bg:#E3E0D1;
  --panel:#EDEBDF;
  --panel-2:#F7F5EC;
  --ink:#21160E;
  --muted:#6B5C4C;
  --line:#CBBFA3;
  --accent:#5C0D11;
  --accent-ink:#FFF8EC;
  --ok:#2C6A2C; --ok-bg:#DCE8D1;
  --warn:#8A5600; --warn-bg:#F2E3BD;
  --bad:#9E1B22; --bad-bg:#F3D6D3;
  --info-bg:#E4DCC6;
  --font-body: Verdana, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
  --font-display: Georgia, "Times New Roman", "Microsoft JhengHei", serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.55 var(--font-body)}
a{color:var(--accent-tx,var(--accent))}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}
.small{font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid #C27C00;outline-offset:1px}

/* demo bar */
#demo{background:#FFF1BF;border-bottom:1px dashed #B58B00;font-size:12px}
.drow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:6px 16px}
.drow .tagp{background:#B58B00;color:#fff;font-weight:700;padding:0 6px;border-radius:2px}
.drow span.grow{flex:1 1 360px}

/* header */
#hdr{background:var(--panel);border-bottom:2px solid var(--accent)}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding-top:8px;padding-bottom:0}
.brand{display:flex;align-items:baseline;gap:10px;padding-bottom:8px}
.brand a{font-family:var(--font-display);font-weight:700;font-size:21px;color:var(--accent-tx,var(--accent));text-decoration:none;letter-spacing:.02em}
.brand .sub{font-size:11px;color:var(--muted)}
.nav{display:flex;flex-wrap:wrap;align-self:flex-end}
.navbtn{display:inline-block;padding:7px 12px 8px;color:var(--accent-tx,var(--accent));font-weight:700;text-decoration:none;border-bottom:3px solid transparent}
.navbtn:hover{background:var(--panel-2)}
.navbtn.on{border-bottom-color:var(--accent)}
.cnt{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--line);color:var(--ink);font-size:11px;text-align:center;font-weight:700}
.navbtn .cnt.hot,.tab .cnt.hot{background:var(--bad);color:#fff}
.hright{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--accent);border-radius:3px;overflow:hidden}
.seg button{border:0;background:var(--panel-2);padding:3px 10px;color:var(--accent-tx,var(--accent));cursor:pointer;font:inherit;font-weight:700}
.seg button + button{border-left:1px solid var(--accent)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.who{font-weight:700}
.who small{font-weight:400;color:var(--muted)}
.bellwrap{position:relative}
.bell{position:relative;display:inline-flex;align-items:center}
.bell .badge{position:absolute;top:-7px;right:-8px;background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;line-height:16px;font-weight:700}
.dropdown{position:absolute;right:0;top:calc(100% + 6px);width:min(360px,92vw);max-height:440px;overflow:auto;z-index:40;background:var(--panel);border:1px solid var(--accent);border-radius:3px;box-shadow:0 8px 24px rgba(40,20,10,.25)}
.dd-h{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);font-weight:700;color:var(--accent-tx,var(--accent))}
.nitem{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 10px;font:inherit;cursor:pointer;color:var(--ink)}
.nitem:hover{background:var(--panel-2)}
.nitem.unread{background:#FBF3E2;font-weight:700}
.nitem.admin{border-left:3px solid var(--accent)}
.nitem time{display:block;font-weight:400;color:var(--muted);font-size:11px}

/* buttons, inputs */
.btn{display:inline-block;border:1px solid var(--accent);background:var(--panel-2);color:var(--accent-tx,var(--accent));padding:4px 11px;border-radius:3px;cursor:pointer;font:inherit;font-weight:700;text-decoration:none;white-space:nowrap}
.btn:hover{background:#fff}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#7B171C}
.btn.small{padding:1px 8px;font-size:12px}
.btn.danger{border-color:var(--bad);color:var(--bad-tx,var(--bad))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--accent-tx,var(--accent));text-decoration:underline;cursor:pointer;font:inherit}
input,select,textarea{font:inherit;border:1px solid var(--line);background:#FFFDF7;color:var(--ink);padding:4px 7px;border-radius:3px}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input.sm{width:72px}
input.err{border-color:var(--bad);background:var(--bad-bg)}
textarea{width:100%;resize:vertical}
.grow{flex:1 1 200px;min-width:160px}

/* layout */
main{padding:18px 0 40px}
.mhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:10px}
h1{font-family:var(--font-display);font-size:22px;color:var(--accent-tx,var(--accent));margin:0;text-wrap:balance}
h2{font-size:14px;color:var(--accent-tx,var(--accent));margin:0 0 8px}
.panel{background:var(--panel);border:1px solid var(--accent);border-radius:0 0 3px 3px}
.panel.pad{padding:14px 16px;border-radius:3px}
.tabs{display:flex;flex-wrap:wrap;gap:2px}
.tab{border:1px solid var(--accent);border-bottom:0;background:var(--info-bg);color:var(--accent-tx,var(--accent));padding:6px 14px;border-radius:3px 3px 0 0;cursor:pointer;font:inherit;font-weight:700}
.tab.on{background:var(--panel)}
.filters{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.fgroup{display:inline-flex;align-items:center;gap:4px}
.fgroup label,.flabel{color:var(--muted);font-size:12px;margin-right:2px}
.chip{border:1px solid var(--line);background:var(--panel-2);padding:2px 8px;border-radius:3px;cursor:pointer;font:inherit;font-weight:700;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.seller{display:inline-flex;gap:6px;align-items:center}
.chip.seller button{border:0;background:none;color:inherit;cursor:pointer;font:inherit;padding:0}

/* tables */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;color:var(--accent-tx,var(--accent));border-bottom:1px solid var(--accent);padding:6px 10px;white-space:nowrap;background:var(--panel)}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--panel-2)}
.num{text-align:right;white-space:nowrap}
td .sub{font-size:11px;color:var(--muted)}
.nm{font-weight:700}
.ext{text-decoration:none;font-weight:400;margin-left:3px;padding:0 3px;border-radius:2px}
.ext:hover{background:var(--info-bg)}
.price{font-weight:700}
.price small{font-weight:400;color:var(--muted)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap}
.pill.available{background:var(--ok-bg);color:var(--ok)}
.pill.in_trade,.pill.active{background:var(--warn-bg);color:var(--warn)}
.pill.sold,.pill.done{background:var(--info-bg);color:var(--accent-tx,var(--accent))}
.pill.withdrawn,.pill.archived,.pill.expired,.pill.cancelled{background:#E0DBCF;color:var(--muted)}
.pill.bad{background:var(--bad-bg);color:var(--bad-tx,var(--bad))}
.pill.lame{background:var(--warn-bg);color:var(--warn);margin-left:2px}
.rollin{width:58px;text-align:right}
.wb{display:inline-block;font-size:10px;font-weight:700;border:1px solid var(--line);border-radius:2px;padding:0 4px;color:var(--muted);vertical-align:1px}
.wb.isk{border-color:#7A5AA8;color:#5B3E88}
.tag{font-size:11px;color:var(--muted);border:1px dashed var(--line);padding:0 6px;border-radius:2px;white-space:nowrap}
.attr{display:inline-flex;gap:2px}
.attr b{display:inline-block;width:17px;text-align:center;font-size:11px;border:1px solid var(--line);background:var(--panel-2);border-radius:2px}
.avg{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.avgbar{width:42px;height:5px;background:#D6CDB7;border-radius:3px;overflow:hidden}
.avgbar i{display:block;height:100%;background:var(--accent)}
.avg.hi{font-weight:700}
.empty{padding:28px;text-align:center;color:var(--muted)}
.acts{white-space:nowrap}
.acts .btn + .btn{margin-left:4px}
.warn-t{color:var(--warn)}
.bad-t{color:var(--bad-tx,var(--bad));font-size:12px}

/* price reference */
.pref{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.pref-t{font-weight:700;color:var(--accent-tx,var(--accent))}
.pref-n{display:flex;gap:22px}
.pref-n div{display:flex;flex-direction:column}
.pref-n span{font-size:11px;color:var(--muted)}
.pref-n .price{font-size:16px}
.hint{padding:8px 12px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}

/* notices */
.notice{border-left:3px solid var(--warn);background:var(--warn-bg);padding:8px 11px;font-size:12px;border-radius:0 3px 3px 0}
.notice.info{border-color:var(--accent);background:var(--info-bg)}
.notice.bad{border-color:var(--bad);background:var(--bad-bg)}
.notice.ok{border-color:var(--ok);background:var(--ok-bg)}
#banner .notice{margin-top:12px}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(33,22,14,.5);display:flex;align-items:flex-start;justify-content:center;padding:44px 16px;overflow:auto;z-index:50}
.modal{background:var(--panel);border:2px solid var(--accent);border-radius:4px;max-width:520px;width:100%;box-shadow:0 12px 34px rgba(0,0,0,.3)}
.modal.wide{max-width:700px}
.modal h3{margin:0;padding:9px 12px 9px 16px;background:var(--accent);color:var(--accent-ink);font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal h3 .q{color:var(--accent-ink)!important}
.modal .x{border:0;background:none;color:var(--accent-ink);font-size:20px;line-height:1;cursor:pointer;padding:0 4px}
.modal .body{padding:14px 16px;display:grid;gap:12px}
.form{display:grid;gap:6px}
.form label{font-weight:700;font-size:12px;color:var(--accent-tx,var(--accent));margin-top:4px}
.form .note{font-size:12px;color:var(--warn);background:var(--warn-bg);padding:5px 8px;border-radius:3px}
.err{color:var(--bad-tx,var(--bad));margin:0;min-height:1em;font-size:12px}
.mbtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dgrid{display:grid;grid-template-columns:max-content 1fr;gap:5px 16px;margin:0}
.dgrid dt{color:var(--muted);font-size:12px}
.dgrid dd{margin:0}
.dact{display:grid;gap:8px}
.dact .row-btns{display:flex;gap:8px;flex-wrap:wrap}
.section{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px}
.section h4{margin:0;font-size:12px;color:var(--accent-tx,var(--accent))}
.thread{display:grid;gap:6px;border:1px solid var(--line);border-radius:3px;padding:8px;background:var(--panel-2)}
.thread-h{display:flex;justify-content:space-between;font-weight:700;font-size:12px}
.msg{padding:5px 9px;border-radius:3px;background:#fff;border:1px solid var(--line);max-width:85%;justify-self:start}
.msg.mine{justify-self:end;background:#F4E6D3}
.msg time{display:block;font-size:10px;color:var(--muted)}
.compose{display:flex;gap:6px;align-items:flex-end}
.compose textarea{min-height:38px}
.hist{margin:0;padding-left:18px;font-size:12px;color:var(--muted)}

/* sell */
.sellgrid{display:grid;gap:14px}
.steps{margin:0 0 8px;padding-left:22px;display:grid;gap:2px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.badlines{font-family:Consolas,monospace;font-size:11px;background:var(--panel-2);border:1px solid var(--line);padding:6px 8px;white-space:pre-wrap;word-break:break-all;margin:4px 0 0}

/* admin */
.cards{display:grid;gap:10px;padding:12px}
.card{border:1px solid var(--line);background:var(--panel-2);border-radius:3px;padding:10px 12px;display:grid;gap:6px}
.card-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.card-a{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.quote{margin:0;padding:6px 10px;border-left:3px solid var(--line);background:#fff}
.loglist{margin:0;padding:12px 12px 12px 32px;display:grid;gap:4px}
.pad{padding:12px}

footer{border-top:1px solid var(--line);padding:14px 0 30px;color:var(--muted);font-size:12px}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:3px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.toast.bad{background:var(--bad)}

@media (max-width:720px){
  .hide-sm{display:none}
  .hright{margin-left:0}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

body.busy, body.busy button{cursor:progress}
.bulk{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:4px}
.bulk label{display:inline-flex;gap:5px;align-items:center}
#bulk-price,input[data-dprice]{width:96px}
.star{border:0;background:none;color:var(--muted);font-size:17px;line-height:1;padding:2px 4px;cursor:pointer;border-radius:3px}
.star:hover{color:var(--warn)}.star.on{color:#D9A400}html[data-theme=dark] .star.on{color:#E8C04A}.star.big{font-size:20px;padding:0 6px}
.rowact{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
th.ck,td.ck{width:28px;padding-right:0;text-align:center}td.ck input,th.ck input{width:16px;height:16px;cursor:pointer;margin:0}
.selbar{position:sticky;bottom:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;background:var(--panel-2);border-top:2px solid var(--accent);box-shadow:0 -4px 12px rgba(0,0,0,.12)}
.selbar .grow{flex:1}
.link.copyb{font-size:12px;margin-left:2px}
.ok-t{color:var(--ok)}
.filters.chips{border-top:0;padding-top:0}
.dtool{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.dtool .dt-h{font-weight:700;font-size:13px;min-width:5.5em}
.dtool input.xs,input.xs{width:58px}
.rngs{display:flex;flex-direction:column;gap:6px}.rng{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
#dq-btns{display:inline-flex;flex-wrap:wrap;gap:8px}
.sellgrid>*{min-width:0}
#offer-in{width:180px}.section.offer .offer-form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.offer-st{margin:0 0 8px}
.hist.offers li{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:4px 0}.hist.offers li.done{opacity:.75}.ofs-act{margin-left:auto;display:inline-flex;gap:6px;align-items:center}
.pill.ofs-accepted,.pill.ofs-used{background:var(--ok-bg);color:var(--ok)}.pill.ofs-declined{background:var(--bad-bg);color:var(--bad-tx,var(--bad))}.pill.ofs-expired{background:var(--info-bg);color:var(--muted)}
.bp-prev{flex-basis:100%;padding-left:calc(5.5em + 10px)}.bp-f{font-weight:700}
@media (max-width:640px){.bp-prev{padding-left:0}}
:root{--q-peerless:#A8127A;--q-legendary:#BF5200;--q-magnificent:#2457C8;--q-exquisite:#237A35;--q-superior:#5E5E5E}
/* dark theme: Flexoki dark (stephango.com/flexoki) - base 950/900/850 layers (no pure black), 100 off-white text, 500 muted, 400 accents; the maroon accent becomes white, red stays for errors only */
html[data-theme=dark]{--bg:#1C1B1A;--panel:#282726;--panel-2:#343331;--ink:#E6E4D9;--muted:#9F9D96;--line:#4A4845;--accent:#E6E4D9;--accent-tx:#E6E4D9;--accent-ink:#1C1B1A;--ok:#A0AF54;--ok-bg:#2D3412;--warn:#D0A215;--warn-bg:#3F3210;--bad:#D14D41;--bad-tx:#E8705F;--bad-bg:#4A2220;--info-bg:#403E3C;--q-peerless:#E47DA8;--q-legendary:#EC8B49;--q-magnificent:#66A0C8;--q-exquisite:#A0AF54;--q-superior:#B7B5AC;color-scheme:dark}
html[data-theme=dark] :focus-visible{outline-color:#D0A215}
html[data-theme=dark] input,html[data-theme=dark] select,html[data-theme=dark] textarea{background:#1C1B1A}
/* dark buttons are black and white: the chosen / main one is white with black text, the others black with white text */
html[data-theme=dark] .btn,html[data-theme=dark] .seg button,html[data-theme=dark] .chip{background:#1C1B1A;color:#E6E4D9}
html[data-theme=dark] .btn.danger{color:#E8705F}
html[data-theme=dark] .btn:hover,html[data-theme=dark] .seg button:hover,html[data-theme=dark] .chip:hover{background:#403E3C}
html[data-theme=dark] .btn.primary,html[data-theme=dark] .seg button.on,html[data-theme=dark] .chip.on,html[data-theme=dark] .pager .btn.on{background:#E6E4D9;color:#1C1B1A}
html[data-theme=dark] .btn.primary:hover,html[data-theme=dark] .seg button.on:hover,html[data-theme=dark] .chip.on:hover{background:#CECDC3}
html[data-theme=dark] .nitem.unread{background:#403E3C}
html[data-theme=dark] .pill.withdrawn,html[data-theme=dark] .pill.archived,html[data-theme=dark] .pill.expired,html[data-theme=dark] .pill.cancelled{background:#403E3C}
html[data-theme=dark] .wb.isk{border-color:#A699D0;color:#A699D0}
html[data-theme=dark] .avgbar{background:#4A4845}
html[data-theme=dark] .msg,html[data-theme=dark] .quote{background:#343331}
html[data-theme=dark] .msg.mine{background:#403E3C}
html[data-theme=dark] .navbtn .cnt.hot,html[data-theme=dark] .tab .cnt.hot,html[data-theme=dark] .bell .badge{color:#F2F0E5}
html[data-theme=dark] .modal-back{background:rgba(0,0,0,.6)}
/* frames and the dialog title bar in mid / dark gray rather than bright lines */
html[data-theme=dark] #hdr,html[data-theme=dark] .panel,html[data-theme=dark] .tab,html[data-theme=dark] th,html[data-theme=dark] .dropdown,html[data-theme=dark] .eqf-pop,html[data-theme=dark] .modal{border-color:#6F6E69}
html[data-theme=dark] .modal h3{background:#403E3C;color:#E6E4D9}
html[data-theme=dark] .modal h3 .q,html[data-theme=dark] .modal .x{color:#E6E4D9!important}
.theme-btn{display:inline-flex;align-items:center}
.bl-add{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.bl-add input{min-width:220px}
#results.stale{opacity:.5;transition:opacity .15s}
.hvut-update{border:2px solid var(--bad);background:var(--bad-bg);padding:12px 14px;border-radius:4px;margin:0 0 16px}
.hvut-update .big{color:var(--bad-tx,var(--bad));font-size:19px;font-weight:700;line-height:1.45;margin:0 0 6px}
.hvut-update .lnk{margin:0 0 4px}
.hvut-update .lnk a{color:var(--bad-tx,var(--bad));font-size:15px;font-weight:700}
.hvut-update summary{cursor:pointer;font-weight:700;color:var(--bad-tx,var(--bad))}
.hvut-fmt{white-space:pre-wrap;word-break:break-all;background:var(--panel-2);border:1px solid var(--line);padding:8px;font-size:11px;margin:6px 0}
.filters{position:relative}
.eqf-n{display:inline-block;min-width:17px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;line-height:16px;text-align:center}
.btn.primary .eqf-n{background:var(--accent-ink);color:var(--accent-tx,var(--accent))}
.eqf-pop{position:absolute;left:12px;right:12px;top:calc(100% - 4px);z-index:30;background:var(--panel-2);border:1px solid var(--accent);border-radius:4px;box-shadow:0 10px 30px rgba(33,22,14,.25);max-height:min(70vh,640px);display:flex;flex-direction:column}
.eqf-pop[hidden]{display:none}
.eqf-body{overflow:auto;padding:4px 14px 8px}
.eqf-sec{padding:10px 0;border-bottom:1px solid var(--line)}
.eqf-sec:last-child{border-bottom:0}
.eqf-sec h3{margin:0 0 6px;font-size:13px}
.eqf-sec h3 small{font-weight:400;color:var(--muted);margin-left:8px}
.eqf-grp{display:flex;gap:6px;align-items:baseline;margin:4px 0}
.eqf-cs{display:flex;flex-wrap:wrap;gap:5px;flex:1}
.eqf-gl{color:var(--muted);font-size:11px;width:84px;flex:none}
.eqf-none{color:var(--muted);font-style:italic}
.chip .en{font-weight:400;opacity:.75;margin-left:3px}
.eqf-foot{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);background:var(--panel)}
.eqf-foot .eqf-cnt{font-weight:700}
.eqf-foot .eqf-rule{flex:1}
.eqf-sel{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line)}
.eqf-sel:empty{display:none}
.eqf-sel .chip{display:inline-flex;gap:6px;align-items:center;cursor:default}
.eqf-sel .chip b{font-weight:400;opacity:.7}
.eqf-sel .chip button{border:0;background:none;color:inherit;cursor:pointer;font:inherit;padding:0 2px}
@media (max-width:640px){.eqf-pop{position:fixed;left:6px;right:6px;top:56px;max-height:calc(100vh - 70px)}.eqf-grp{flex-direction:column;align-items:stretch;gap:3px}.eqf-gl{width:auto}.eqf-gl:empty{display:none}.eqf-foot .eqf-rule{display:none}}
.rsum{color:var(--muted);font-size:12px;padding:8px 2px 4px}
.pager{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;padding:14px 0 6px}
.pager .btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pager .gap{color:var(--muted);padding:0 2px}

.pill.paused{background:transparent;color:var(--warn);box-shadow:inset 0 0 0 1px currentColor}
.backtag{color:var(--accent-tx,var(--accent));font-weight:700;cursor:help;white-space:nowrap}

.offerbox{display:grid;gap:6px;margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:4px;background:var(--panel-2);margin-bottom:6px}
.offerbox p{margin:0}.offer-h b{font-size:13px;color:var(--accent-tx,var(--accent))}
.offer-form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.offerbox .hist.offers{margin:0;padding-left:0;list-style:none}

tr.grp td{background:var(--panel-2);font-weight:700;font-size:13px;padding:7px 10px;border-top:2px solid var(--line)}

.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.presets[hidden]{display:none}.chip.preset{padding:0;display:inline-flex;align-items:stretch;overflow:hidden}
.chip.preset button{background:none;border:0;color:inherit;font:inherit;padding:4px 10px;cursor:pointer}
.chip.preset .x{padding:4px 8px 4px 2px;opacity:.65}.chip.preset .x:hover{opacity:1}
.ps-save{display:inline-flex;gap:6px;align-items:center;margin-left:auto}.ps-save label{font-weight:700;font-size:13px}.ps-save input{width:9em}
@media(max-width:620px){.eqf-foot .ps-save{order:9;flex-basis:100%;margin-left:0}.eqf-foot .ps-save input{flex:1;width:auto;min-width:0}}

.bm-list{max-height:52vh;overflow:auto;margin-bottom:8px}.bm-list td{vertical-align:middle}.bm-list input.sm{width:8em}
#modal-root input.chg{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}#modal-root input.bad{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad-bg)}
#modal-root .dtool.bp{margin:0}

/* base stat ranges per quality (ehwiki, The Armory): ROLL % = (AVG - min) / (max - min) */
const QRANGE={Legendary:[170,200],Magnificent:[150,180],Exquisite:[120,160],Superior:[90,130],Average:[60,100],Fair:[30,70],Crude:[0,40]};
function rollFromAvg(q,avg){
  if(avg==null||!Number.isFinite(avg))return null;
  if(q==='Peerless')return 100;
  const r=QRANGE[q];if(!r)return null;
  const v=(avg-r[0])/(r[1]-r[0])*100;
  return Math.round(Math.max(0,Math.min(100,v))*10)/10;
}

class ApiErr extends Error{constructor(code){super(code);this.code=code;}}
async function rpc(fn,args){
  if(!CFG.url||!CFG.key)throw new ApiErr('E_CFG');
  const h={'Content-Type':'application/json','apikey':CFG.key};
  if(/^eyJ/.test(CFG.key))h.Authorization='Bearer '+CFG.key;   // legacy anon key is a JWT; publishable keys go in apikey only
  let r;
  try{r=await fetch(CFG.url.replace(/\/+$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args||{})});}
  catch(e){throw new ApiErr('E_NET');}
  let j=null;try{j=await r.json();}catch(e){}
  if(!r.ok){const m=(j&&j.message)||'';console.warn(fn,r.status,j);throw new ApiErr(/^E_[A-Z_]+$/.test(m)?m:'E_SERVER');}
  return j;
}
const api=(fn,args)=>rpc(fn,Object.assign({p_token:P.token},args||{}));
function handleErr(e){
  const c=(e&&e.code)||'E_SERVER';
  if(c==='E_AUTH'){P.token='';A.me=null;savePrefs();closeModal();render();toast(t('E_AUTH'),true);return;}
  if(c==='E_PW_RESET'){mChangePw(true);return;}
  if(!(e instanceof ApiErr))console.error(e);
  toast(T.zh[c]!==undefined?t(c):t('E_SERVER'),true);
  if(c==='E_STATE'||c==='E_NOT_AVAILABLE')after();
}

/* Data a view loaded less than a minute ago is reused when you come back to it (switching pages or browser
   tabs), so the site does not ask the server again for the same thing. Your own actions, logging in, changing
   world and the Refresh button always load fresh data. */
const FRESH_MS=60000;
let lastMe=0;const viewAt={};
function viewFresh(){
  const now=Date.now();
  if(now-(viewAt[UI.view]||0)>=FRESH_MS||now-lastMe>=FRESH_MS)return false;
  return UI.view!=='market'||!!(A.market&&A.market.world===P.world&&A.market.tab===UI.tab);
}
async function refresh(force){
  if(force)clearCaches();
  else if(viewFresh()){render();return;}
  try{if(Date.now()-lastMe>3000)await loadMe();await loadView();}catch(e){handleErr(e);}   /* the account was just loaded at start-up */
  render();
}
async function after(){
  clearCaches();   /* an action can change what every page shows */
  try{await loadMe();await loadView();if(UI.detailId)A.detail=await rpc('hv_listing',{p_token:P.token||null,p_id:UI.detailId});}
  catch(e){if(e.code==='E_NOT_FOUND'){UI.detailId=null;closeModal();}else handleErr(e);}
  render();
  if(UI.detailId&&A.detail&&$('#modal-root .detail'))renderDetail();
  checkForcedPw();
}

/* ================= Chinese equipment names =================
   In 繁中 / 简中 equipment names are shown the way DDD's HV综合汉化 userscript shows them: the same word
   replacements (EQN_DICT, longest first) and the same coloured markers (EQN_COLORS). The data is in
   src/eqname.js, made by tools/gen_eqname.py. Names are stored in English; this only changes the display. */
const EQN_COL={hans:1,zh:2};
const eqnCache={1:new Map(),2:new Map()};
let eqnRules=null;
function eqnCompiled(){
  if(!eqnRules)eqnRules=EQN_DICT.map(([k,hans,hant])=>{const m=k.match(/^\/(.*)\/([a-z]*)$/);
    return [m?new RegExp(m[1],'g'):new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+'),'g'),hans,hant];});
  return eqnRules;
}
/* English equipment text (a name, a type, a category) in the current Chinese script; unchanged in English */
function eqZh(text){
  const col=EQN_COL[P.lang];if(!col||!text)return text||'';
  const c=eqnCache[col];if(c.has(text))return c.get(text);
  let out=String(text);for(const r of eqnCompiled())out=out.replace(r[0],r[col]);
  c.set(text,out);return out;
}
const eqGlyph=h=>h.replace(/\u{168D4}/gu,'<span class="hv-ultimate-symbol">\u{168D4}</span>');
/* the same, as HTML with coloured markers */
function eqZhHTML(text){
  const col=EQN_COL[P.lang];if(!col)return esc(text);
  const src=eqZh(text);let h='',i=0;
  while(i<src.length){
    const r=EQN_COLORS.find(x=>src.startsWith(x[col],i));
    if(r){h+=`<span class="hv-eq-token ${r[0]}">${eqGlyph(esc(r[col]))}</span>`;i+=r[col].length;continue;}
    let next=src.length;for(const x of EQN_COLORS){const f=src.indexOf(x[col],i+1);if(f!==-1&&f<next)next=f;}
    h+=esc(src.slice(i,next));i=next;
  }
  return h;
}
/* Chinese words typed in the search box become the English words they translate, e.g. 魔光 → Radiant,
   火伤 → Fiery or Surtr. Each group is a list of alternatives; every group has to match. */
let eqnIdx=null;
function eqnIndex(){
  if(!eqnIdx){const cats=new Set(['One-handed Weapon','Two-handed Weapon','Cloth Armor','Light Armor','Heavy Armor']);   /* category names never appear in item names */
    eqnIdx=EQN_DICT.filter(([k])=>!cats.has(k)).map(([k,hans,hant])=>{const m=k.match(/^\/(.*)\/[a-z]*$/);
      const en=(m?m[1].replace(/\\b|\^|\$/g,''):k).replace(/^\s*of\s+/,'').trim();return {en,zh:[hans.trim(),hant.trim()]};});}
  return eqnIdx;
}
function eqnLookup(w){const out=new Set();for(const e of eqnIndex())if(e.zh[0].includes(w)||e.zh[1].includes(w))out.add(e.en);return [...out];}
const CJK_RUN=/[㐀-鿿豈-﫿]+|[^㐀-鿿豈-﫿]+/g,CJK=/[㐀-鿿豈-﫿]/;
function queryGroups(q){
  const groups=[];
  for(const tok of String(q||'').trim().split(/\s+/).filter(Boolean)){
    for(const run of tok.match(CJK_RUN)||[]){
      if(!CJK.test(run)){const w=run.replace(/[^\w\-'.]/g,'');if(w)groups.push([w]);continue;}
      /* longest piece first: 鐵木法杖 → 鐵木 + 法杖 */
      let i=0,miss='';
      while(i<run.length){
        let j=run.length,hit=null;
        for(;j>i;j--){const m=eqnLookup(run.slice(i,j));if(m.length){hit=m;break;}}
        if(hit){groups.push(hit.slice(0,40));i=j;}else{miss+=run[i];i++;}
      }
      if(miss)groups.push([miss]);
    }
  }
  return groups.slice(0,8);
}

/* ================= import parser ================= */
function stripBB(s){return s.replace(/\[\/?(?:size|b|i|u|s|color|font|url)(?:=[^\]]*)?\]/gi,'');}
const EQ_RE='(?:https?:\\/\\/)?(?:alt\\.)?hentaiverse\\.org\\/(isekai\\/)?equip\\/(\\d+)\\/([0-9a-f]{6,})';
/* Reads, one item per line:
   - HVUT "equipment code": [316911528] [url=https://hentaiverse.org/equip/316911528/acd6e112b5]Name[/url] (Lv.500, AVG: 186, IW)
     with [size=3] category and [size=2] type headings; "Soulbound" replaces the level
   - forum shop lines: [oak01] [url=…]Name[/url] (64.4% iw) (Lv.500) - (150k); lines wrapped in [s]…[/s] are sold and skipped
   - plain links: https://hentaiverse.org/equip/314232310/afe61dd0ed (the name then has to be typed in) */
function parseImport(text){
  const items=[],bad=[];let cat='',type='',struck=0;
  const catByLower={};CATS.forEach(c=>catByLower[c.toLowerCase()]=c);
  for(const raw of String(text).split(/\r?\n/)){
    const line=raw.trim();if(!line)continue;
    const h=line.match(/^\[size=(\d+)\]\s*\[b\]\s*\[(.+?)\]\s*\[\/b\]\s*\[\/size\]$/i);
    if(h){const nm=h[2].trim();if(+h[1]>=3){cat=catByLower[nm.toLowerCase()]||nm;type='';}else type=nm;continue;}
    if(/^\[s\]/i.test(line)){if(new RegExp(EQ_RE,'i').test(line))struck++;continue;}
    let world,equip_id,equip_key,name='',tail='';
    const m=line.match(new RegExp('\\[url=\\s*'+EQ_RE+'\\/?\\s*\\]([\\s\\S]*?)\\[\\/url\\]','i'));
    if(m){world=m[1]?'isekai':'main';equip_id=+m[2];equip_key=m[3].toLowerCase();name=stripBB(m[4]).replace(/\s+/g,' ').trim();tail=line.slice(m.index+m[0].length);}
    else{
      const u=line.match(new RegExp(EQ_RE,'i'));
      if(!u){bad.push(line);continue;}
      world=u[1]?'isekai':'main';equip_id=+u[2];equip_key=u[3].toLowerCase();tail=line.slice(u.index+u[0].length);
      const rest=stripBB(tail).replace(/\([^()]*\)/g,' ').replace(/\s-\s*$/,'').replace(/\s+/g,' ').trim();
      if(QUALITIES.includes(rest.split(' ')[0]))name=rest;
    }
    if(!/^[A-Za-z]/.test(name))name=name.replace(/^[^A-Za-z]+/,'');
    const first=name.split(' ')[0];const quality=QUALITIES.includes(first)?first:'';
    let level=null,soul=false,untr=false,unas=false,attrs='',hv_avg=null,avgPct=null,roll=null,rem='',priceText='';
    for(const g of tail.matchAll(/(\s-\s*)?\(([^()]*)\)/g)){
      if(g[1]){priceText=g[2].trim();continue;}
      for(const part of g[2].split(',').map(x=>x.trim()).filter(Boolean)){
        let x;
        if((x=part.match(/^(?:Lv|Level)\.?\s*(\d{1,4})$/i)))level=+x[1];
        else if(/^soul\s*bound$/i.test(part))soul=true;
        else if(/^un\s*trad(?:e)?able$/i.test(part))untr=true;
        else if(/^unassigned$/i.test(part))unas=true;
        /* "AVG: 186" (HVUT now, rounded) or "AVG: 68.1% / 190.4" (newer HVUT: its own ROLL % and the exact AVG) */
        else if(/^AVG\b/i.test(part)){for(const n of part.replace(/^AVG\s*[:=]?/i,'').matchAll(/(\d+(?:\.\d+)?)\s*(%?)/g)){if(n[2])avgPct=+n[1];else if(hv_avg==null)hv_avg=Math.round(+n[1]*10)/10;}}
        else if(/^[SDEAIW]{1,6}$/.test(part))attrs=part;
        else if((x=part.match(/^(\d+(?:\.\d+)?)\s*%(?:\s+([aiw]{1,3}))?/i))){roll=+x[1];if(x[2])rem=x[2].toUpperCase();}
      }
    }
    /* HVUT writes the price typed in its inventory page after the brackets: "(…) @ 10m" */
    if(!priceText){const at=tail.match(/\)\s*@\s*([\d.,]+\s*[kKmM]?)/);if(at)priceText=at[1];}
    if(/靈魂綁定|灵魂绑定/.test(line))soul=true;
    /* the name decides type and category; HVUT headings only fill in when the name has no known type */
    const nt=typeFromName(name);
    const tp=nt||(m?type:'');
    const c=catOf(nt)||(m&&cat&&CATS.includes(cat)?cat:catOf(tp));
    if(!attrs&&rem)attrs=['A','I','W'].filter(x=>rem.includes(x)).join('');
    if(roll==null){
      const calc=rollFromAvg(quality,hv_avg);
      /* HVUT's own % comes from the unrounded AVG, so it is the more exact one, as long as it uses the same
         scale as the site (within rounding of the shown AVG); otherwise the site's own formula decides */
      if(quality==='Peerless'||avgPct==null)roll=calc;
      else if(calc==null||Math.abs(avgPct-calc)<=0.35)roll=avgPct;
      else roll=calc;
    }
    if(roll!=null&&(roll<0||roll>100))roll=null;
    items.push({world,equip_id,equip_key,name,quality,type:tp,cat:c,level,roll,hv_avg,attrs,lame:lameOf(c,attrs),soul,untr,unas,fromTag:!!m,price:importPrice(priceText)});
  }
  return {items,bad,struck};
}

   Filtering, sorting and paging happen in the database (hv_market_search), so a visit downloads one page of 50
   items however big the market grows. Text boxes search shortly after typing stops; lists and buttons at once. */
function searchArgs(){
  const f=UI.filters;
  return {p_world:P.world,p_tab:UI.tab,p_page:UI.page,p_token:P.token||null,p_f:{q:f.q.trim(),qa:queryGroups(f.q),qual:f.qual,
    cats:f.eq.cat,types:f.eq.type,slots:f.eq.slot,pres:f.eq.pre,sufs:f.eq.suf,
    lv_min:parseInt(f.lvMin)||null,lv_max:parseInt(f.lvMax)||null,p_min:priceIn(f.pMin)||null,p_max:priceIn(f.pMax)||null,
    r_min:pct(f.rMin),r_max:pct(f.rMax),
    attrs:f.attrs.join(''),seller:f.seller?Number(f.seller):null,sort:f.sort}};
}
/* a ROLL % box: '', '50', '64.4' or '64.4%'; anything outside 0–100 is ignored */
function pct(v){v=String(v||'').replace('%','').trim();if(!v)return null;const n=Math.round(parseFloat(v)*100)/100;return n>=0&&n<=100?n:null;}
let mkSeq=0,mkTimer=null;
/* only the newest request may update the page, so a slow answer never overwrites a newer one */
/* pages of results seen in the last minute (tab, page, filters) are reused instead of asked for again */
const mkCache=new Map();
function clearCaches(){for(const k in viewAt)delete viewAt[k];mkCache.clear();}
async function loadMarket(){
  const seq=++mkSeq,args=searchArgs(),key=JSON.stringify(args),hit=mkCache.get(key);
  let d;
  if(hit&&Date.now()-hit.at<FRESH_MS)d=hit.d;
  else{
    d=await rpc('hv_market_search',args);
    mkCache.set(key,{at:Date.now(),d});
    if(mkCache.size>40)mkCache.delete(mkCache.keys().next().value);
  }
  if(seq!==mkSeq)return false;
  d.world=args.p_world;A.market=d;viewAt.market=Date.now();return true;
}
async function runSearch(){
  clearTimeout(mkTimer);
  try{if(await loadMarket()&&UI.view==='market'){renderMarketHead();renderResults();}}catch(e){handleErr(e);}
}
function searchSoon(delay){

}

/* saved market filters ("快捷"), kept on the account: a name and every filter on the page (search, equipment
   filter, quality, level, price, ROLL, stats, sort). Clicking one replaces the current filters with it */
function presets(){return A.me&&Array.isArray(A.me.filters)?A.me.filters:[];}
function fNorm(f){
  const d=defaultFilters(),x=f&&typeof f==='object'?f:{},e=x.eq&&typeof x.eq==='object'?x.eq:{};
  Object.keys(d).forEach(k=>{if(k==='eq'||x[k]===undefined||x[k]===null)return;d[k]=Array.isArray(d[k])?(Array.isArray(x[k])?x[k].map(String):[]):String(x[k]);});
  EQ_SECS.forEach(k=>{d.eq[k]=Array.isArray(e[k])?e[k].map(String):[];});
  if(d.seller&&x.sellerName)d.sellerName=String(x.sellerName);
  return d;
}
function fKey(f){const n=fNorm(f);delete n.sellerName;n.attrs=[...n.attrs].sort();EQ_SECS.forEach(k=>{n.eq[k]=[...n.eq[k]].sort();});return JSON.stringify(n);}

function bpCalc(){

  else if(b.mode==='mul'){const n=parseFloat(String(b.n).replace(',','.'));if(!(n>0))return {err:'bp_bad_n'};

    sel.forEach(d=>{if(d.roll==null){skip++;return;}const v=Math.round(Number(d.roll)*10)/10,m=rs.find(([lo,hi])=>v>=lo&&v<=hi);if(m)out.push([d.id,m[2]]);else skip++;});}

  const p=pendingSaves[k];if(!p)return;clearTimeout(p.tm);delete pendingSaves[k];
  const set={};
  if(p.key==='name'){const nmv=String(p.value).replace(/\s+/g,' ').trim();const q=QUALITIES.includes(nmv.split(' ')[0])?nmv.split(' ')[0]:'';const tp=typeFromName(nmv);Object.assign(set,{name:nmv,quality:q,type:tp,cat:catOf(tp)});}
  else set[p.key]=p.value;
  try{await api('hv_draft_update',{p_ids:[p.id],p_set:set});const d=(A.drafts||[]).find(x=>x.id===p.id);if(d)Object.assign(d,set);}
  catch(e){handleErr(e);}
}
async function flushDraftSaves(){await Promise.all(Object.keys(pendingSaves).map(runDraftSave));}

async function doImport(){
  const {items,bad,struck}=parseImport(UI.sellText);
  UI.sellBad=bad;UI.importMsg='';UI.importWarn=null;
  if(!items.length){UI.importMsg='';renderMain();toast(t('sell_none'),true);return;}
  const soul=items.filter(x=>x.soul||x.untr).length;
  const seen=new Set(),todo=[];
  for(const it of items){
    const k=it.world+':'+it.equip_id;
    if(it.soul||it.untr||seen.has(k))continue;seen.add(k);
    todo.push(it);
  }
  let added=0,updated=0,onMarket=0,filled=0;
  const ok=await act(async()=>{
    for(let i=0;i<todo.length;i+=500){
      const chunk=todo.slice(i,i+500).map(r=>({world:r.world,equip_id:r.equip_id,equip_key:r.equip_key,quality:r.quality,name:r.name,type:r.type,cat:r.cat,level:r.level,attrs:r.attrs,lame:r.lame,roll:r.roll,hv_avg:r.hv_avg,price:r.price}));
      const r=await api('hv_draft_add',{p_items:chunk});added+=r.added;updated+=r.updated;onMarket+=r.active||0;filled+=r.filled||0;
    }
  });
  if(!ok)return;
  const keys=new Set(todo.map(x=>x.world+':'+x.equip_id));UI.dq={qual:'',type:'',q:''};
  (A.drafts||[]).forEach(d=>{if(keys.has(d.world+':'+d.equip_id))UI.dsel.add(d.id);});
  const parts=added+updated?[t('import_done',{added,updated})]:[];
  if(soul)parts.push(t('import_skip_soul',{n:soul}));
  if(filled)parts.push(t('import_filled',{n:filled}));
  if(onMarket)parts.push(t('import_skip_active',{n:onMarket}));
  if(struck)parts.push(t('import_skip_struck',{n:struck}));
  UI.importMsg=parts.join(' ');UI.sellText='';
  /* items without ROLL or level: pasted as plain links / forum links, or exported by an old HVUT format */
  const noRoll=todo.filter(x=>x.roll==null).length,noLv=todo.filter(x=>x.level==null&&!x.unas).length;
  UI.importWarn=(noRoll||noLv)?{noRoll,noLv}:null;
  render();
}

function infoCell(l){
  const st=l.status;
  if(st==='available'){const age=daysSince(l.renewed_at);return t('age_listed',{d:daysSince(l.created_at)})+(l.offers_open?` · <b class="warn-t">${t('offers_n',{n:l.offers_open})}</b>`:'')+(age>=EXPIRE_DAYS-7?` · <span class="warn-t">${t('expires_in',{d:Math.max(0,EXPIRE_DAYS-age)})}</span>`:'');}
  if(st==='expired')return `<span class="warn-t">${t('expired_note')}</span>`;
  if(st==='in_trade'){const dd=daysSince(l.trade_at);return t('buyer_is',{name:l.buyer||'?'})+(l.buyer?' '+copyBtn(l.buyer):'')+(l.deal_price?' · '+t('deal_is',{p:{html:priceHTML(l.deal_price)}}):'')+' · '+t('trade_days',{d:dd})+(dd>=STALE_DAYS?`<div class="bad-t">${t('stale_warn',{d:STALE_DAYS})}</div>`:'');}
  if(st==='sold')return t('buyer_is',{name:l.buyer||'?'})+(l.buyer?' '+copyBtn(l.buyer):'')+' · '+t('sold_date',{d:fmtDate(ts(l.sold_at))});
  if(st==='withdrawn')return l.withdraw_reason?t(l.withdraw_reason):'';
  if(st==='archived')return t('isk_season',{n:l.season??'?'});
  return '';
}

/* suggest the next label by counting up the last number: 2026-2 → 2026-3, 7 → 8 */
function nextSeason(s){s=String(s??'');const m=s.match(/^(.*?)(\d+)$/);return m?m[1]+(Number(m[2])+1):'';}
const SEASON_RE=/^[0-9A-Za-z][0-9A-Za-z._-]{0,19}$/;
function mSeason(){openModal(t('ad_season'),`<p style="margin:0 0 10px">${t('ad_season_confirm_v2')}</p>
  <label for="season-next">${t('season_next')}</label> <input id="season-next" class="sm" style="width:110px" maxlength="20" placeholder="2026-2" value="${esc(nextSeason(A.admin?A.admin.season:''))}">
  <p class="muted small" style="margin:4px 0 0">${t('season_fmt')}</p>${okCancel('season-ok','',t('confirm'),'danger')}`);}
function val(id){const el=document.getElementById(id);return el?el.value:'';}
function setErr(k){const el=$('#m-err');if(el)el.innerHTML=t(k);}

async function doLogin(){
  const name=val('m-user').trim(),pw=val('m-pw');
  if(!name){setErr('err_name_req');return;}
  try{
    const r=await rpc('hv_login',{p_name:name,p_pw:pw});
    if(r.error){setErr(r.error);return;}
    P.token=r.token;A.me=r.me;savePrefs();closeModal();toast(t('welcome',{name:r.me.name}));await refresh(true);checkForcedPw();
  }catch(e){if(e.code&&T.zh[e.code]!==undefined)setErr(e.code);else handleErr(e);}
}
async function doRegister(){
  const name=val('m-user').trim(),pw=val('m-pw'),pw2=val('m-pw2');
  if(!name){setErr('err_name_req');return;}
  if(name.length>30){setErr('err_name_long');return;}
  if(pw.length<6){setErr('err_pw_short');return;}
  if(pw!==pw2){setErr('err_pw_match');return;}
  try{
    const r=await rpc('hv_register',{p_name:name,p_pw:pw});
    P.token=r.token;A.me=r.me;savePrefs();closeModal();toast(t('reg_done'));await refresh(true);
  }catch(e){if(e.code&&T.zh[e.code]!==undefined&&e.code!=='E_NET'&&e.code!=='E_CFG'&&e.code!=='E_SERVER')setErr(e.code);else handleErr(e);}
}
async function doChangePw(){
  const forced=!!(A.me&&A.me.pw_reset);
  const pw=val('m-pw'),pw2=val('m-pw2');
  if(pw===RESET_PW){const el=$('#m-err');if(el)el.textContent=t('err_reset_pw',{pw:RESET_PW});return;}
  if(pw.length<6){setErr('err_pw_short');return;}
  if(pw!==pw2){setErr('err_pw_match');return;}
  try{
    A.me=await api('hv_change_pw',{p_cur:forced?'':val('m-cur'),p_new:pw});
    UI.forcePw=false;closeModal();toast(t('pw_changed'));await refresh(true);
  }catch(e){if(e.code==='E_CUR_PW'||e.code==='E_PW_SHORT'||e.code==='E_RESET_PW')setErr(e.code);else handleErr(e);}
}

document.addEventListener('click',e=>{
  if(UI.eqOpen&&!e.target.closest('#eqf-pop,#eqf-btn,#eqf-sel'))eqClose(false);
  if(UI.notifOpen&&!e.target.closest('.bellwrap')){UI.notifOpen=false;const dd=$('.dropdown');if(dd)dd.remove();const b=$('.bell');if(b)b.setAttribute('aria-expanded','false');}
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=H[el.dataset.act];if(fn)fn(el,e);
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.dataset.form;if(f==='login')doLogin();if(f==='reg')doRegister();if(f==='chpw')doChangePw();});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.bprice!==undefined){el.classList.remove('bad');el.classList.toggle('chg',el.dataset.was!==undefined&&priceIn(el.value)!==N(el.dataset.was));return;}
  if(el.id==='offer-in'){const c=el.value.replace(/[^0-9.,kKmMcC]/g,'');if(c!==el.value)el.value=c;offerPrev();return;}
  if(el.dataset.f){UI.filters[el.dataset.f]=el.value;searchSoon(el.tagName==='SELECT'?0:450);return;}
  if(el.id==='sell-text'){UI.sellText=el.value;return;}
  if(el.id==='dsel-all'){if(el.checked)dVis().forEach(d=>UI.dsel.add(d.id));else UI.dsel.clear();renderDraftParts();return;}
  if(el.dataset.msel!==undefined){const id=N(el.dataset.msel),l=(UI.pageItems||[]).find(x=>x.id===id);if(el.checked&&l)UI.msel.set(id,l);else UI.msel.delete(id);renderSel();return;}
  if(el.dataset.mselAll!==undefined){(UI.pageItems||[]).forEach(l=>{if(el.checked)UI.msel.set(l.id,l);else UI.msel.delete(l.id);});renderSel();return;}
  if(el.dataset.ssel!==undefined){const id=N(el.dataset.ssel);if(el.checked)UI.ssel.add(id);else UI.ssel.delete(id);renderSsel();return;}
  if(el.dataset.sselAll!==undefined){(UI.sselPage||[]).forEach(id=>{if(el.checked)UI.ssel.add(id);else UI.ssel.delete(id);});renderSsel();return;}
  if(el.dataset.mf){UI.mf[el.dataset.mf]=el.value;renderMineList();return;}
  if(el.dataset.dq){UI.dq[el.dataset.dq]=el.value;if(el.tagName==='SELECT'){const id=el.id;renderDrafts();const f=document.getElementById(id);if(f)f.focus();}else renderDraftParts();return;}
  if(el.dataset.bp){bpFix();P.bp[el.dataset.bp]=el.value;savePrefs();if(el.dataset.bp==='mode')renderBp();else{const pv=$('#bp-prev');if(pv)pv.innerHTML=bpPreview();}return;}
  if(el.dataset.rg!==undefined){bpFix();const r=P.bp.ranges[N(el.dataset.rg)];if(r){r[el.dataset.k]=el.value;savePrefs();}const pv=$('#bp-prev');if(pv)pv.innerHTML=bpPreview();return;}
  if(el.dataset.dsel!==undefined){const id=N(el.dataset.dsel);if(el.checked)UI.dsel.add(id);else UI.dsel.delete(id);renderDraftParts();return;}
  const did=el.dataset.dprice||el.dataset.droll||el.dataset.dname;
  if(did!==undefined){
    const d=(A.drafts||[]).find(x=>x.id===N(did));if(!d)return;
    const v=el.value.trim();
    if(el.dataset.dprice!==undefined){if(!v){d.price=null;queueDraftSave(d.id,'price',null);}else{const p=priceIn(v);if(!p){el.classList.add('err');return;}d.price=p;queueDraftSave(d.id,'price',p);}}
    else if(el.dataset.droll!==undefined){if(!v){d.roll=null;queueDraftSave(d.id,'roll',null);}else{const r=parseFloat(v.replace('%',''));if(!(r>=0&&r<=100)){el.classList.add('err');return;}d.roll=Math.round(r*10)/10;queueDraftSave(d.id,'roll',d.roll);}}
    else{d.name=v;queueDraftSave(d.id,'name',v);}
    el.classList.remove('err');updDraftPill(d);if(el.dataset.droll!==undefined){const pv=$('#bp-prev');if(pv)pv.innerHTML=bpPreview();}return;
  }
});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset&&el.dataset.blLevel!==undefined){act(()=>api('hv_block',{p_name:el.dataset.blLevel,p_level:Number(el.value)}),t('bl_updated')).then(ok=>{if(ok)A.market=null;});return;}
const did=el.dataset&&(el.dataset.dprice||el.dataset.droll||el.dataset.dname);if(did!==undefined){for(const k of Object.keys(pendingSaves))if(k.startsWith(did+':'))runDraftSave(k);}});
window.addEventListener('beforeunload',()=>{for(const k of Object.keys(pendingSaves))runDraftSave(k);});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.id==='bl-name'){e.preventDefault();H['bl-add']();return;}
  if(e.key==='Enter'&&e.target&&e.target.id==='ps-name'){e.preventDefault();H['preset-save']();return;}
  if(e.key==='Enter'&&e.target&&e.target.id==='offer-in'){e.preventDefault();const b=$('[data-act="offer-send"]');if(b)b.click();return;}
  if(e.key==='Escape'&&UI.eqOpen&&!$('#modal-root').innerHTML){eqClose(true);return;}
  if(e.key==='Escape'&&$('#modal-root').innerHTML&&!UI.forcePw){if($('#modal-root .detail'))closeModal();else back();}
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target.id&&e.target.id.startsWith('pm-in-')){const b=e.target.parentElement.querySelector('[data-act="pm-send"]');if(b)b.click();}
});
function route(){
  const h=(location.hash||'#market').slice(1);
  UI.view=['market','sell','mine','inbox','admin'].includes(h)?h:'market';
  UI.notifOpen=false;window.scrollTo(0,0);render();
  refresh();
}
window.addEventListener('hashchange',route);
/* keep the bell count fresh, and reload the page's data when the tab comes back into view */
setInterval(async()=>{if(!P.token||document.hidden||Date.now()-lastMe<55000)return;try{await loadMe();renderHeader();}catch(e){}},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#modal-root').innerHTML&&!UI.busy)refresh();});

loadPrefs();bpFix();
document.documentElement.lang=htmlLang();
applyTheme();
(async()=>{
  try{await loadMe();}catch(e){}
  route();
  checkForcedPw();
})();

</script>
</body>
</html>
